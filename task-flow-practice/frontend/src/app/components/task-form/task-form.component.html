<form [formGroup]="form" (ngSubmit)="onSubmit()" class="task-form">
  <div *ngIf="errorMessage" class="error-banner" role="alert">{{ errorMessage }}</div>

  <div class="form-group">
    <label for="title">Title <span aria-hidden="true">*</span></label>
    <input id="title" type="text" formControlName="title" placeholder="Task title"
           [class.invalid]="form.get('title')?.invalid && form.get('title')?.touched" />
    <span *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="field-error">
      Title is required.
    </span>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="3" placeholder="Optional description"></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" formControlName="status">
        <option value="TODO">To Do</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="DONE">Done</option>
      </select>
    </div>

    <div class="form-group">
      <label for="priority">Priority</label>
      <select id="priority" formControlName="priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dueDate">Due Date</label>
      <input id="dueDate" type="date" formControlName="dueDate" />
    </div>
  </div>

  <div class="form-group" *ngIf="projects.length > 0">
    <label for="projectId">Project</label>
    <select id="projectId" formControlName="projectId">
      <option [ngValue]="null">— None —</option>
      <option *ngFor="let project of projects" [value]="project.id">{{ project.name }}</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="form.invalid">
      {{ task ? 'Update Task' : 'Create Task' }}
    </button>
    <button type="button" (click)="onCancel()">Cancel</button>
  </div>
</form>
