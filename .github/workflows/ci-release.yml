name: CI and production release

on:
  pull_request:
    paths:
      - 'e-commerce/**'
      - '.github/workflows/ci-release.yml'
  push:
    paths:
      - 'e-commerce/**'
      - '.github/workflows/ci-release.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Full 40-character SHA of a known-good main commit to redeploy to Railway and Vercel
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify CI workflow policy and rejection fixtures
        run: bash scripts/test-ci-policy.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package backend
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e-commerce/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --watch=false
      - name: Build frontend
        run: npm run build

  migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Liquibase up, rollback, and reapply on MySQL 8.4.11
        run: ./mvnw --batch-mode -DmysqlMigrationTest=true -Dtest=MySqlMigrationLifecycleTests test

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, migration]
    defaults:
      run:
        working-directory: e-commerce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start stack and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify stack endpoints
        run: ./scripts/smoke-stack.sh
      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-policy, backend, frontend, migration, compose-smoke]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require a configured Vercel backend origin
        run: |
          if grep -q '\.invalid/' e-commerce/frontend/vercel.json; then
            echo "Set the Railway backend origin in e-commerce/frontend/vercel.json before releasing." >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked deployment CLIs
        working-directory: e-commerce/tools/deploy
        run: npm ci
      - name: Deploy Railway backend
        working-directory: e-commerce/backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          "$GITHUB_WORKSPACE/e-commerce/tools/deploy/node_modules/.bin/railway" up --service "$RAILWAY_SERVICE"
      - name: Deploy Vercel frontend
        working-directory: e-commerce/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          "$GITHUB_WORKSPACE/e-commerce/tools/deploy/node_modules/.bin/vercel" deploy --prod --yes
      - name: Verify deployed health and integration path
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
        run: bash e-commerce/scripts/smoke-production.sh

  rollback-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked deployment CLIs
        working-directory: e-commerce/tools/deploy
        run: npm ci
      - name: Check out the known-good main commit
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          if [[ ! "${ROLLBACK_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "rollback_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          git merge-base --is-ancestor "${ROLLBACK_SHA}" HEAD
          git checkout --detach "${ROLLBACK_SHA}"
      - name: Require a configured Vercel backend origin
        run: |
          if grep -q '\.invalid/' e-commerce/frontend/vercel.json; then
            echo "The rollback commit has no Railway backend origin in e-commerce/frontend/vercel.json." >&2
            exit 1
          fi
      - name: Redeploy Railway backend
        working-directory: e-commerce/backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          "$GITHUB_WORKSPACE/e-commerce/tools/deploy/node_modules/.bin/railway" up --service "$RAILWAY_SERVICE"
      - name: Redeploy Vercel frontend
        working-directory: e-commerce/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          "$GITHUB_WORKSPACE/e-commerce/tools/deploy/node_modules/.bin/vercel" deploy --prod --yes
      - name: Verify rolled-back health and integration path
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
        run: bash e-commerce/scripts/smoke-production.sh
