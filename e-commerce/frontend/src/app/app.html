<a class="skip-link" href="#main-content" (click)="skipToMainContent($event, mainContent)">
  Skip to content
</a>

<mat-sidenav-container
  class="shell"
  (keydown.escape)="closeCompactNavigation(drawer, $event)"
>
  <mat-sidenav
    #drawer
    id="compact-navigation"
    class="compact-drawer"
    data-testid="compact-navigation"
    mode="over"
  >
    <nav aria-label="Compact navigation">
      <mat-nav-list>
        <a mat-list-item routerLink="/products" (click)="drawer.close()">Products</a>
        <a mat-list-item routerLink="/login" (click)="drawer.close()">Log in</a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <header>
      <mat-toolbar class="toolbar">
        <button
          #menuButton
          mat-button
          class="compact-only"
          type="button"
          aria-label="Open navigation menu"
          aria-controls="compact-navigation"
          [attr.aria-expanded]="drawer.opened"
          (click)="drawer.toggle()"
        >
          Menu
        </button>
        <a class="brand" data-testid="brand" routerLink="/products">E-Commerce</a>
        <nav class="desktop-navigation" aria-label="Primary navigation">
          <a mat-button routerLink="/products">Products</a>
          <a mat-button class="account-action" routerLink="/login">Log in</a>
        </nav>
        <a mat-button class="compact-only" routerLink="/login">Log in</a>
      </mat-toolbar>
    </header>

    <main #mainContent id="main-content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
