# Keep context tests independent from a developer's local MySQL instance.
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Migrations will be enabled in tests after the first changelog is added.
spring.liquibase.enabled=false
